<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسالة سرية من أمي</title><style>body{margin:0;font-family:system-ui,Tahoma;background:linear-gradient(140deg,#d5f5e5,#dceefb);color:#173e48;min-height:100vh}main{max-width:520px;margin:25px auto;padding:22px;background:#ffffffed;border-radius:24px;box-shadow:0 8px 35px #2455 20}h1{text-align:center;color:#116c65}p{text-align:center}input,textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #9ac8c6;border-radius:12px;margin:7px 0 15px;font:inherit}button{font:inherit;background:#087c70;color:white;border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%;margin:7px 0}button:disabled{opacity:.45}.icons{display:flex;gap:9px}.icons button{background:#e8f4f2;color:#143c39;font-size:26px}.icons button.active{outline:3px solid #087c70}.hidden{display:none}.result{padding:24px;border-radius:18px;background:#fff4d8;text-align:center;white-space:pre-wrap;line-height:2}.muted{font-size:13px;color:#52706c}label{font-weight:700}</style></head><body><main><h1>💌 رسالة سرية من أمي</h1><p>صندوق الكنز 404 🔐 رسالة حب تفتحها ابنتكِ كمفاجأة.</p><section id="form"><label>اسم الطالبة</label><input id="girl" placeholder="اسم الابنة"><label>رسالتك السرية</label><textarea id="msg" rows="5" placeholder="يا صغيرتي، أحبك وأفتخر بك..."></textarea><label>اسم الأم</label><input id="mom" placeholder="أمك المحبة"><button id="seal">🔒 إغلاق ظرف الرسالة</button></section><section id="sealed" class="hidden"><p>💌 هناك رسالة سرية تنتظركِ!</p><button id="open">🔑 افتحي الظرف يا بطلة</button></section><section id="opened" class="hidden"><div class="result" id="out"></div><button id="copy">نسخ الرسالة</button><button id="reset">إعداد رسالة جديدة</button></section><p class="muted">المفاجأة تعمل على نفس الجهاز فقط. النسخ لا ينشئ رابطًا خاصًا ولا يرسل الرسالة تلقائيًا.</p></main><script>let saved='';const f=document.getElementById('form'),s=document.getElementById('sealed'),o=document.getElementById('opened');document.getElementById('seal').onclick=()=>{const g=document.getElementById('girl').value.trim(),m=document.getElementById('mom').value.trim(),t=document.getElementById('msg').value.trim();if(!g||!m||!t){alert('أكملي الحقول أولًا');return}saved=`💌 إلى ابنتي ${g}\n\n${t}\n\nأمك المحبة: ${m}`;f.classList.add('hidden');s.classList.remove('hidden')};document.getElementById('open').onclick=()=>{s.classList.add('hidden');o.classList.remove('hidden');document.getElementById('out').textContent=saved};document.getElementById('reset').onclick=()=>{o.classList.add('hidden');f.classList.remove('hidden')};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(saved);alert('تم النسخ')}catch(e){prompt('انسخي الرسالة:',saved)}};</script></body></html>
