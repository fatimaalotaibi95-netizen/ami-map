<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بصمة أمي على الخريطة</title><style>body{margin:0;font-family:system-ui,Tahoma;background:linear-gradient(140deg,#d5f5e5,#dceefb);color:#173e48;min-height:100vh}main{max-width:520px;margin:25px auto;padding:22px;background:#ffffffed;border-radius:24px;box-shadow:0 8px 35px #2455 20}h1{text-align:center;color:#116c65}p{text-align:center}input,textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #9ac8c6;border-radius:12px;margin:7px 0 15px;font:inherit}button{font:inherit;background:#087c70;color:white;border:0;border-radius:14px;padding:14px;cursor:pointer;width:100%;margin:7px 0}button:disabled{opacity:.45}.icons{display:flex;gap:9px}.icons button{background:#e8f4f2;color:#143c39;font-size:26px}.icons button.active{outline:3px solid #087c70}.hidden{display:none}.result{padding:24px;border-radius:18px;background:#fff4d8;text-align:center;white-space:pre-wrap;line-height:2}.muted{font-size:13px;color:#52706c}label{font-weight:700}</style></head><body><main><h1>🧭 بصمة أمي على الخريطة</h1><p>مغامرة السفينة 404 🏝️ اختاري رمزًا واكتبي بصمتك لابنتك.</p><section id="form"><label>اسم الأم</label><input id="mom" placeholder="اسم الأم"><label>اسم الطالبة</label><input id="girl" placeholder="اسم الابنة"><label>اختاري رمز البصمة</label><div class="icons" id="icons"><button type="button" class="active" data-s="🧭">🧭</button><button type="button" data-s="⭐">⭐</button><button type="button" data-s="🏝️">🏝️</button><button type="button" data-s="🚢">🚢</button></div><label>رسالة الأم</label><textarea id="msg" rows="4" placeholder="ابنتي الغالية، أنتِ بوصلتي نحو النجاح..."></textarea><button id="submit">📍 ثبّتي بصمتك على الخريطة</button></section><section id="finish" class="hidden"><div id="out" class="result"></div><button id="copy">نسخ البصمة لإرسالها للمعلمة</button><button id="back">تعديل البصمة</button></section><p class="muted">تظهر البصمة على هذا الجهاز فقط؛ لإرسالها للمعلمة استخدمي زر النسخ.</p></main><script>let sym='🧭',saved='';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sym=b.dataset.s;document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('submit').onclick=()=>{const m=document.getElementById('mom').value.trim(),g=document.getElementById('girl').value.trim(),t=document.getElementById('msg').value.trim();if(!m||!g||!t){alert('أكملي الأسماء والرسالة أولًا');return}saved=`${sym} بصمة أمي على الخريطة\nالطالبة: ${g}\n${t}\nمن الأم: ${m}`;document.getElementById('out').textContent=saved;document.getElementById('form').classList.add('hidden');document.getElementById('finish').classList.remove('hidden')};document.getElementById('back').onclick=()=>{document.getElementById('form').classList.remove('hidden');document.getElementById('finish').classList.add('hidden')};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(saved);alert('تم النسخ')}catch(e){prompt('انسخي البصمة:',saved)}};</script></body></html>
